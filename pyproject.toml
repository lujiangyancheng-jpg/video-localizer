[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "youtube-chinese-localizer"
version = "0.7.0.14"
description = "A private, resumable desktop workflow for downloading and localizing authorized videos."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Video Localizer contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "filelock>=3.16,<4",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0.1,<2",
  "PyYAML>=6.0.2,<7",
  "rich>=13.8,<15",
  "tenacity>=9,<10",
  "typer>=0.12.5,<1",
  "websockets>=14,<18",
  "yt-dlp[default,deno]>=2026.7.4",
]

[project.optional-dependencies]
transcription = ["faster-whisper>=1.1.0"]
offline-translation = [
  "ctranslate2>=4,<5",
  "sentencepiece>=0.2,<0.3",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
youtube-localizer = "youtube_localizer.cli:run"
youtube-localizer-gui = "youtube_localizer.gui:run_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/youtube_localizer"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: offline integration tests that require local FFmpeg",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
